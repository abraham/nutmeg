name: Index
on: push
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test
  test-success:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all test matrix jobs to pass
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
      - run: echo "All test matrix jobs passed."
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install
      - run: npm run lint
